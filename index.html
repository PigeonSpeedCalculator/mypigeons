
<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تسجيل الحمام</title>
  <script type="module" src="app.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; direction: rtl; }
    input, button, select { margin: 5px 0; padding: 8px; width: 100%; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>🕊️ تسجيل الحمام</h1>

  <button id="login">تسجيل الدخول بجيميل</button>
  <button id="logout" class="hidden">تسجيل الخروج</button>

  <div id="formSection" class="hidden">
    <h2>أدخل بيانات الحمامة</h2>
    <input type="text" id="name" placeholder="اسم الحمامة" />
    <input type="text" id="ring" placeholder="رقم الخاتم" />
    
    <select id="fatherSelect"><option value="">اختر الأب</option></select>
    <select id="motherSelect"><option value="">اختر الأم</option></select>

    <button id="saveBtn">حفظ</button>

    <h3>🐦 الحمام المسجل:</h3>
    <ul id="myBirds"></ul>
  </div>
</body>
</html>
